<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Hex/Square Badge -->
  <rect width="64" height="64" rx="16" fill="url(#swGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Geometric 'S' Wave Element -->
  <path d="M 22 22 C 16 22, 16 31, 23 32 C 30 33, 30 42, 23 42 C 18 42, 17 38, 17 38" 
        fill="none" 
        stroke="url(#cyanAccent)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Geometric 'W' Modern Tech Monogram -->
  <path d="M 33 24 L 37 40 L 42 27 L 47 40 L 51 24" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Code / Tech Accent Dot -->
