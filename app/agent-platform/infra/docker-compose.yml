version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orvian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orvian_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orvian_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-orvian_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvian_admin} -d ${POSTGRES_DB:-orvian_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orvian_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-orvian_redis_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orvian_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: orvian_coturn
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TURN_PORT=3478
      - TURN_PORT_TLS=5349
      - ALT_PORT=3479
      - ALT_PORT_TLS=5350
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/turnserver.conf"

volumes:
  postgres_data:
  redis_data:
